<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Movie Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Movie Collection</h1>
      <p id="stats" class="stats">Loading your shelf…</p>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search title, director or genre" aria-label="Search movies">
      <select id="sort" aria-label="Sort movies">
        <option value="newest">Recently added</option>
        <option value="rating">Highest rated</option>
        <option value="title">Title A–Z</option>
        <option value="year">Newest release</option>
      </select>
      <label class="check"><input id="fav-only" type="checkbox"> Favorites only</label>
      <button id="add-btn" class="btn primary" type="button">Add movie</button>
    </div>
  </header>

  <main>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <h2>Nothing on the shelf yet</h2>
      <p>Add your first movie with a poster, a rating and a short review.</p>
      <button id="empty-add" class="btn primary" type="button">Add movie</button>
    </div>
  </main>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2 id="dialog-title">Add movie</h2>

      <div class="form-grid">
        <div class="poster-col">
          <div class="preview" id="preview"><span>Poster preview</span></div>
          <label for="poster">Poster image URL</label>
          <input id="poster" type="url" placeholder="https://…/poster.jpg">
        </div>

        <div class="fields-col">
          <label for="title">Title</label>
          <input id="title" required maxlength="120">

          <label for="director">Director</label>
          <input id="director" required maxlength="120">

          <div class="row">
            <div>
              <label for="year">Year</label>
              <input id="year" type="number" min="1888" max="2100">
            </div>
            <div>
              <label for="genre">Genre</label>
              <input id="genre" maxlength="40" placeholder="Drama, Sci-Fi…">
            </div>
          </div>

          <label for="rating">Your rating: <output id="rating-out">7.0</output> / 10</label>
          <input id="rating" type="range" min="0" max="10" step="0.5" value="7">
        </div>
      </div>

      <label for="review">Your review</label>
      <textarea id="review" rows="3" maxlength="1000" placeholder="What did you think?"></textarea>

      <p id="form-error" class="form-error" role="alert"></p>

      <div class="actions">
        <button type="button" id="cancel" class="btn ghost">Cancel</button>
        <button type="submit" id="save" class="btn primary">Save movie</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
