---
- name: Install prerequisites
  ansible.builtin.apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Add the NodeSource repository for Node.js {{ node_major }}
  ansible.builtin.shell: "curl -fsSL https://deb.nodesource.com/setup_{{ node_major }}.x | bash -"
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Create the application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"

- name: Create the data directory for the file database
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0750"

- name: Copy the build artifact to the server
  ansible.builtin.copy:
    src: "{{ artifact_path }}"
    dest: "{{ app_dir }}/release.tar.gz"
    owner: "{{ app_user }}"
  register: artifact

- name: Unpack the artifact
  ansible.builtin.unarchive:
    src: "{{ app_dir }}/release.tar.gz"
    dest: "{{ app_dir }}"
    remote_src: true
    owner: "{{ app_user }}"
  when: artifact.changed
  notify: Restart movie app

- name: Install production dependencies
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: "{{ app_dir }}"
  when: artifact.changed

- name: Install the systemd service file
  ansible.builtin.template:
    src: movie-app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify: Restart movie app

- name: Enable and start the service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true